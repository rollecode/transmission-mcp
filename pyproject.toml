[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transmission-mcp"
version = "1.0.0"
description = "MCP server for Transmission, every RPC method"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["transmission", "mcp", "torrent", "bittorrent", "model-context-protocol"]

dependencies = [
    # <2 until the MCPServer migration: 2.x moved mcp.server.fastmcp
    "mcp>=1.29.0,<2",
    "httpx[socks]>=0.27.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
transmission-mcp = "transmission_mcp.server:main"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/transmission_mcp"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Tools have to hand every failure back as a structured error string; an
# exception escaping into the stdio stream kills the session.
"src/transmission_mcp/server.py" = ["BLE001"]
